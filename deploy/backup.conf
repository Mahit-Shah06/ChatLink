# Timer-driven jobs (not long-running services). Same format plus a schedule.
#
#   name | description | command | oncalendar
#
# `oncalendar` uses systemd's syntax:
#   daily            once a day at midnight
#   *-*-* 03:00:00   every day at 3am
#   hourly           every hour
#   Mon *-*-* 09:00  Mondays at 9am

backup | Learning Engine backup | python3 tools/backup.py | *-*-* 03:00:00
