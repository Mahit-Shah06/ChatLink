# Services the installer will create. One per line:
#
#   name | description | command
#
# `name` becomes chatlink-<name>.service, so `chatlink-bot` here.
# `command` runs from the repo root with the venv already on PATH.
#
# To add something later: append a line, re-run ./deploy/install.sh, done.
# Lines starting with # are ignored.

bot       | ChatLink Discord bot        | python3 main.py
dashboard | Learning Engine dashboard   | python3 -m learning.cli serve

# Examples of things you might add later:
# apiserver | Some other local API      | python3 tools/other_api.py
# watcher   | File watcher              | python3 tools/watch.py
